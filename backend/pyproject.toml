[build-system]
requires = ["setuptools==70.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-cabinet-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.13.2",
  "anthropic[bedrock]==2.8.0",
  "boto3==1.44.2",
  "fastapi==0.111.0",
  "mangum==0.17.0",
  "psycopg[binary]==3.1.19",
  "pydantic==2.8.2",
  "PyJWT[crypto]==2.10.1",
  "python-multipart==0.0.33",
  "SQLAlchemy==2.0.31",
  "tzdata==2024.1",
  "uvicorn==0.30.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.0",
  "pytest==8.3.3",
  "ruff==0.6.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Deprecations inside starlette 0.37 (pinned by fastapi 0.111), not in our code.
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning",
  # mangum 0.17 calls asyncio.get_event_loop(); harmless on Python 3.12.
  "ignore:There is no current event loop:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Path",
  "fastapi.Query",
]
