# Render Blueprint: the whole MindLeaf stack in one file.
# Render → New → Blueprint → this repository, Blueprint Path: infra/render.yaml.
# Step by step (and the Cognito part) — infra/README.md.

databases:
  - name: mindleaf-db
    plan: free
    region: frankfurt
    databaseName: mindleaf
    user: mindleaf
    postgresMajorVersion: "16"

services:
  # FastAPI backend, the same Docker image as in docker-compose. It runs the
  # Alembic migrations on every start (see backend/Dockerfile).
  - type: web
    name: mindleaf-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: mindleaf-db
          property: connectionString
      # Filled in after the Cognito user pool exists (infra/README.md, step 3).
      - key: COGNITO_AUTHORITY
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      # If Render gives the services other URLs (the name was taken), put the
      # real ones here and in VITE_API_URL below.
      - key: CORS_ORIGINS
        value: https://mindleaf-web.onrender.com
      - key: SITE_URL
        value: https://mindleaf-web.onrender.com
      - key: PUBLIC_API_URL
        value: https://mindleaf-api.onrender.com
      # Homework photos on the container's disk: fine for a demo, gone after a
      # redeploy or restart (the free plan has no persistent disk).
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOADS_DIR
        value: /tmp/mindleaf-uploads
      - key: FILES_SECRET
        generateValue: true
      # No Bedrock here: written quiz answers go straight to the tutor.
      - key: AI_GRADER
        value: "off"
      # Telegram reminders (infra/README.md, "Нагадування в Telegram").
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # The scheduler (.github/workflows/reminders.yml) sends it as X-Cron-Token.
      - key: CRON_TOKEN
        generateValue: true

  # React frontend as a static site; every path falls back to index.html.
  - type: web
    name: mindleaf-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://mindleaf-api.onrender.com
      # Filled in after the Cognito user pool exists (infra/README.md, step 3).
      - key: VITE_COGNITO_AUTHORITY
        sync: false
      - key: VITE_COGNITO_CLIENT_ID
        sync: false
      - key: VITE_COGNITO_DOMAIN
        sync: false
