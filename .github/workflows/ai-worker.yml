# The AI worker for the Render deployment: every 5 minutes it grades written
# quiz answers and turns materials into draft quizzes with Claude Haiku 5.5 on
# Amazon Bedrock. It never touches the database: it talks to the API through
# /api/internal/* with GRADER_TOKEN. Anything it cannot grade goes to the tutor
# and is never retried, so a broken model cannot keep spending money.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   API_URL                e.g. https://mindleaf-api.onrender.com (shared with reminders.yml)
#   GRADER_TOKEN           the same value as GRADER_TOKEN of mindleaf-api on Render
#   AWS_ACCESS_KEY_ID      an IAM user allowed to call Claude on Bedrock
#   AWS_SECRET_ACCESS_KEY
# Setup: infra/README.md, "AI grading and quiz generation".
name: ai-worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ai-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets
        id: check
        env:
          API_URL: ${{ secrets.API_URL }}
          GRADER_TOKEN: ${{ secrets.GRADER_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$GRADER_TOKEN" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "API_URL / GRADER_TOKEN / AWS secrets are not set; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      # The worker imports only app/grader, so three packages are enough.
      - name: Install the worker's dependencies
        if: steps.check.outputs.ready == 'true'
        run: pip install "anthropic[bedrock]==2.8.0" "boto3==1.44.2" "pydantic==2.8.2"

      - name: Wake up the API
        if: steps.check.outputs.ready == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
        # The free Render instance sleeps when idle; the first call wakes it.
        run: curl -sS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$API_URL/api/health"

      - name: Grade answers and generate quizzes
        if: steps.check.outputs.ready == 'true'
        working-directory: backend
        env:
          API_URL: ${{ secrets.API_URL }}
          GRADER_TOKEN: ${{ secrets.GRADER_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          GRADER: bedrock
        run: python -m app.grader.run --api "$API_URL"
