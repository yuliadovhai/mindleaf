# Telegram reminders: every 10 minutes asks the API to send what is due.
# The API remembers what it already sent, so a late or repeated run is harmless.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   API_URL     e.g. https://mindleaf-api.onrender.com
#   CRON_TOKEN  the same value as CRON_TOKEN of mindleaf-api on Render
name: reminders

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_TOKEN" ]; then
            echo "API_URL / CRON_TOKEN secrets are not set; nothing to do."
            exit 0
          fi
          # The free Render instance may be asleep: the first call wakes it up.
          curl -sS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            -X POST -H "X-Cron-Token: $CRON_TOKEN" \
            "$API_URL/api/internal/reminders/run"
